<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  <title>Q4 Project</title>
  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    body{
      background-color: #f4f4f4;
      display: flex;
    }

    .sidebar{
      width: 232px;
      height: 100vh;
      background: #1e2230;
      color: white;
      padding: 50px;
    }

    .logo{
      text-align: center;
      font-size: 30px;
      margin-bottom: 50px;
    }

    .sidebar ul{
      list-style: none;
    }

    .sidebar ul li{
      margin-top: 25px;
      cursor: pointer;
    }

    .sidebar ul li:hover{
      color: #2ec7f7;
    }

    .main{
      padding: 40px;
      width: 100%;
    }

    .title{
      background: #1e2230;
      color: white;
      padding: 11px 20px;
      border-radius: 11px;
      display: inline-block;
      margin-bottom: 45px;
    }

     .card-container{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .card{
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 2px 2px 8px gray;
    }

    .card h2{
      margin-bottom: 10px;
    }

    .card p{
      margin-bottom: 20px;
      color: gray;
      font-size: 14px;
    }

    .btn{
      background: #20c9f3;
      color: white;
      border: none;
      width: 100%;
      padding: 10px;
      border-radius: 5px;
    }

    .btn:hover{
      background: skyblue;
    }

  </style>
</head>

<body>

  <div class="sidebar">

    <div class="logo">
      basta picture
    </div>

    <ul>
      <li>Dashboard</li>
      <li>Virtual Notebook</li>
      <li>Tasks</li>
      <li>Prpfile</li>
      <li>Log out</li>
    </ul>

  </div>

  <div class="main">

    <div class="title">
      TASKS
    </div>

    <div class="card-container">

      <div class="card">
        <h2>Mathematics</h2>
        <p>Drill Sheet 2 <br> Deadline: April 9, 2026</p>

        <button class="btn">
          Take this activity
        </button>
      </div>

      <div class="card">
        <h2>Science</h2>
        <p>Lab Activity 3 <br> Deadline: April 10, 2026</p>

        <button class="btn">
          Take this activity
        </button>
      </div>

      <div class="card">
        <h2>ICT</h2>
        <p>Quarter Project <br> Deadline: May 8, 2026</p>

        <button class="btn">
          Submit
        </button>
      </div>

      <div class="card">
        <h2>VE</h2>
        <p>Film Critique <br> Deadline: April 22, 2026</p>

        <button class="btn">
          Play Video Clip
        </button>
      </div>

    </div>

  </div>

</body>
</html>
